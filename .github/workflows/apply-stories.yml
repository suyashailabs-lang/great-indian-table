name: Apply Immersive Stories
on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - '.github/workflows/apply-stories.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch stories section
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          style = r'''<style id="stories-immersive-style">
          #explore .section-heading{position:relative;z-index:3}
          .stories-stage.immersive{--story-count:1;position:relative;height:calc(var(--story-count)*100vh);top:auto;margin-top:0;perspective:1600px;transform:none}
          .stories-stage.immersive::before{display:none}
          .stories-stage.immersive .table-grid{position:sticky;top:68px;height:calc(100vh - 68px);width:100%;display:block;margin:0;overflow:hidden;perspective:1600px;transform-style:preserve-3d}
          .stories-stage.immersive .table-card{position:absolute;left:50%;top:50%;width:min(720px,68vw);height:min(76vh,720px);margin:0;padding:0;border:0;border-radius:4px;background:#fffaf0;overflow:hidden;opacity:0;pointer-events:none;transform:translate3d(-50%,-50%,-420px) scale(.76) rotateZ(3deg);box-shadow:0 38px 80px rgba(32,51,58,.22);transition:opacity .08s linear;will-change:transform,opacity}
          .stories-stage.immersive .table-card::before{inset:auto 8% -18px 8%;height:30px;background:var(--leaf);opacity:.15;filter:blur(8px);transform:translateZ(-20px)}
          .stories-stage.immersive .table-card::after{box-shadow:inset 0 0 0 1px rgba(32,51,58,.12),inset 0 -90px 110px rgba(20,45,42,.14)}
          .stories-stage.immersive .table-card img{width:100%;height:100%;aspect-ratio:auto;object-fit:cover;transform:none;filter:saturate(.92) contrast(1.02)}
          .stories-stage.immersive .table-card-copy{position:absolute;z-index:4;left:0;right:0;bottom:0;padding:clamp(22px,4vw,42px);color:#fffaf0;text-align:left;background:linear-gradient(180deg,transparent 0%,rgba(20,38,37,.12) 12%,rgba(20,38,37,.86) 100%);transform:translateZ(18px)}
          .stories-stage.immersive .table-card-copy small{display:block;margin-bottom:9px;color:#f4b19b;font-size:.66rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
          .stories-stage.immersive .table-card-copy h3{margin:0 0 5px;font:clamp(2rem,4vw,3.5rem)/.98 var(--display)}
          .stories-stage.immersive .table-card-copy p{margin:0;color:#f6eee2;font-size:.78rem;font-weight:600;letter-spacing:.04em}
          .stories-stage.immersive .table-card-copy::after{content:"READ STORY  →";display:block;margin-top:18px;font-size:.63rem;font-weight:700;letter-spacing:.12em;color:#fffaf0;opacity:.82}
          .stories-stage.immersive .story-counter{position:absolute;z-index:10;left:0;top:50%;transform:translateY(-50%);font:700 .7rem var(--body);letter-spacing:.14em;color:var(--muted);writing-mode:vertical-rl}
          .stories-stage.immersive .story-counter strong{color:var(--rust)}
          .story-overlay .story-dialog{width:min(1180px,94vw);max-height:92vh;overflow:auto;border-radius:6px;box-shadow:0 35px 100px rgba(20,38,37,.35)}
          .story-overlay .story-hero{position:relative;min-height:min(72vh,760px);overflow:hidden}
          .story-overlay .story-hero img{width:100%;height:100%;min-height:min(72vh,760px);object-fit:cover;display:block}
          .story-overlay .story-intro{position:absolute;left:0;right:0;bottom:0;padding:clamp(26px,5vw,64px);color:#fffaf0;background:linear-gradient(180deg,transparent,rgba(20,38,37,.88))}
          .story-overlay .story-intro small{color:#f4b19b;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
          .story-overlay .story-intro h2{margin:.3em 0 .12em;font:clamp(2.7rem,7vw,6rem)/.9 var(--display)}
          .story-overlay .story-intro p{margin:0;font-weight:600}
          .story-overlay .story-content{max-width:780px;margin:auto;padding:clamp(28px,5vw,70px)}
          .story-overlay .story-content section{margin:0 0 42px}
          .story-overlay .story-content h3{margin:0 0 9px;font:1.15rem var(--display);color:var(--rust-dark)}
          .story-overlay .story-content p{margin:0;color:var(--ink);font-size:1rem;line-height:1.8}
          .story-overlay .story-quote{padding:26px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
          .story-overlay .story-quote p{font:clamp(1.5rem,3vw,2.3rem)/1.25 var(--display)}
          @media(max-width:760px){.stories-stage.immersive{height:calc(var(--story-count)*86vh)}.stories-stage.immersive .table-grid{top:68px;height:calc(86vh - 68px)}.stories-stage.immersive .table-card{width:84vw;height:70vh}.stories-stage.immersive .story-counter{display:none}.stories-stage.immersive .table-card-copy{padding:24px}.stories-stage.immersive .table-card-copy h3{font-size:2.2rem}}
          @media(prefers-reduced-motion:reduce){.stories-stage.immersive{height:auto}.stories-stage.immersive .table-grid{position:relative;height:auto;overflow:visible}.stories-stage.immersive .table-card{position:relative;left:auto;top:auto;width:100%;height:520px;margin:0 0 24px;opacity:1!important;pointer-events:auto;transform:none!important}.stories-stage.immersive .story-counter{display:none}}
          </style>'''
          script = r'''<script id="stories-immersive-script">
          (function(){
            const stage=document.querySelector('.stories-stage'),grid=document.getElementById('stories-grid');
            if(!stage||!grid)return;
            const cards=Array.from(grid.querySelectorAll('.table-card')); if(!cards.length)return;
            stage.classList.add('immersive'); stage.style.setProperty('--story-count',cards.length);
            const counter=document.createElement('div'); counter.className='story-counter'; counter.setAttribute('aria-hidden','true'); grid.appendChild(counter);
            cards.forEach((card,i)=>{card.dataset.storyIndex=i;card.setAttribute('aria-label','Read '+(card.querySelector('h3')?.textContent||'story')+' — full story')});
            if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
            let ticking=false;
            const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
            function render(){
              ticking=false; const rect=stage.getBoundingClientRect(); const unit=innerHeight*(innerWidth<=760?.86:1); const progress=clamp(-rect.top/unit,0,cards.length-1); const active=Math.floor(progress),local=progress-active;
              cards.forEach((card,i)=>{
                let offset=i-progress,opacity=0,scale=.78,z=-360,rot=offset<0?-8:8,x=offset*24,y=Math.abs(offset)*8;
                if(Math.abs(offset)<=1.05){const a=Math.abs(offset);opacity=1-clamp((a-.68)/.37,0,1);scale=1-Math.min(a,.98)*.17;z=-Math.min(a,1)*260;rot=offset*7;x=offset*14;y=Math.abs(offset)*3}
                if(i===active){opacity=1-local*.78;scale=1+local*.10;z=local*110;rot=-local*7;x=-local*12;y=-local*2}
                if(i===active+1){opacity=.22+local*.78;scale=.82+local*.18;z=-220+local*220;rot=7-local*7;x=15-local*15;y=5-local*5}
                card.style.opacity=String(clamp(opacity,0,1)); card.style.pointerEvents=(i===active&&local<.8)?'auto':'none'; card.style.transform='translate3d(calc(-50% + '+x+'vw),calc(-50% + '+y+'vh),'+z+'px) scale('+scale+') rotateZ('+rot+'deg)'; card.style.zIndex=String(100-Math.round(Math.abs(offset)*10));
              });
              counter.innerHTML='<strong>'+String(active+1).padStart(2,'0')+'</strong> / '+String(cards.length).padStart(2,'0');
            }
            function requestRender(){if(ticking)return;ticking=true;requestAnimationFrame(render)}
            addEventListener('scroll',requestRender,{passive:true}); addEventListener('resize',requestRender,{passive:true}); render();
          })();
          </script>'''
          if 'id="stories-immersive-style"' not in html: html=html.replace('</head>',style+'\n</head>',1)
          if 'id="stories-immersive-script"' not in html: html=html.replace('</body>',script+'\n</body>',1)
          path.write_text(html,encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Implement immersive story cards"
          git push
