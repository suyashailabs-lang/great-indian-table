name: Apply Table Experience Redesign
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-redesign.yml'
permissions:
  contents: write
jobs:
  redesign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          h=p.read_text(encoding='utf-8')
          style='''<style id="table-experience-redesign">
          .table-hero{position:relative;min-height:calc(100vh - 68px);overflow:hidden;background:#171513;color:#f5ede0;isolation:isolate;display:grid;place-items:center;perspective:1400px}.table-hero::before{content:"INDIA / WORK / EVERYDAY";position:absolute;top:7%;left:4%;font:700 .65rem var(--body);letter-spacing:.22em;color:#d9b875;writing-mode:vertical-rl}.table-hero::after{content:"A VISUAL ARCHIVE";position:absolute;right:4%;bottom:9%;font:700 .62rem var(--body);letter-spacing:.2em;color:#e6d7c2;writing-mode:vertical-rl;opacity:.55}.table-hero-bg{position:absolute;inset:0;background:radial-gradient(circle at 50% 48%,rgba(170,107,55,.2),transparent 32%),linear-gradient(180deg,#171513,#201b17 60%,#100f0d);z-index:-2}.table-hero-grid{position:absolute;inset:0;z-index:-1;opacity:.14;background-image:linear-gradient(rgba(245,237,224,.2) 1px,transparent 1px),linear-gradient(90deg,rgba(245,237,224,.2) 1px,transparent 1px);background-size:80px 80px;transform:perspective(500px) rotateX(62deg) scale(1.8) translateY(23%);transform-origin:center bottom}.table-hero-title{position:absolute;z-index:5;left:50%;top:9%;width:min(92vw,1050px);transform:translateX(-50%);text-align:center;pointer-events:none}.table-hero-title .small{display:block;font:700 .65rem var(--body);letter-spacing:.3em;text-transform:uppercase;color:#d9b875;margin-bottom:8px}.table-hero-title h1{max-width:none;margin:0;font:clamp(3.2rem,9vw,8.6rem)/.82 var(--display);letter-spacing:-.035em;color:#f5ede0}.table-hero-title h1 em{font-family:var(--script);font-style:normal;color:#e1a24a;font-size:.68em}.hero-copy-left,.hero-copy-right{position:absolute;z-index:4;max-width:270px}.hero-copy-left{left:clamp(22px,7vw,100px);top:20%;transform:rotate(-3deg)}.hero-copy-right{right:clamp(22px,7vw,100px);top:25%;text-align:right;transform:rotate(3deg)}.hero-copy-left .eyebrow,.hero-copy-right .eyebrow{color:#d9b875}.hero-copy-left p,.hero-copy-right p{margin:10px 0 0;color:#d5c8b6;font:1rem/1.45 var(--script)}.wood-table{position:relative;z-index:3;width:min(74vw,820px);aspect-ratio:1.45;transform-style:preserve-3d;transform:rotateX(58deg) rotateZ(-4deg) translateY(15%) translateZ(-10px);filter:drop-shadow(0 60px 35px rgba(0,0,0,.55));transition:transform .15s ease-out}.wood-top{position:absolute;inset:0;border-radius:10px 10px 18px 18px;background:linear-gradient(145deg,#9a6037,#6e3e25 38%,#422619);border:3px solid #2c1810;box-shadow:inset 0 0 0 2px rgba(255,218,165,.16),inset 0 -20px 45px rgba(0,0,0,.3)}.wood-top::before{content:"";position:absolute;inset:6% 4%;border-radius:8px;background:repeating-radial-gradient(ellipse at 30% 45%,transparent 0 12px,rgba(255,205,140,.07) 13px 15px,transparent 16px 30px)}.table-edge{position:absolute;left:2%;right:2%;bottom:-9%;height:12%;border-radius:0 0 16px 16px;background:linear-gradient(#61351f,#2c170f);transform:translateZ(-12px);box-shadow:0 18px 20px rgba(0,0,0,.35)}.table-leg{position:absolute;bottom:-35%;width:7%;height:39%;background:linear-gradient(90deg,#3a1d12,#8a4f2b,#341a10);transform-origin:top}.table-leg.one{left:10%;transform:rotate(8deg) translateZ(-30px)}.table-leg.two{right:10%;transform:rotate(-8deg) translateZ(-30px)}.table-object{position:absolute;z-index:4;pointer-events:none}.hero-paper{width:180px;height:110px;left:18%;top:22%;background:#efe2c6;color:#272019;padding:18px;box-shadow:0 14px 22px rgba(0,0,0,.3);transform:translateZ(40px) rotate(-7deg)}.hero-paper b{display:block;font:1.3rem var(--display)}.hero-paper span{font:.55rem var(--body);letter-spacing:.12em;text-transform:uppercase}.hero-cup{width:70px;height:70px;right:19%;top:31%;border-radius:0 0 20px 20px;background:linear-gradient(90deg,#d8b46f,#8b5a2c);box-shadow:0 14px 18px rgba(0,0,0,.35);transform:translateZ(55px) rotate(8deg)}.hero-scroll{position:absolute;z-index:6;bottom:5%;left:50%;transform:translateX(-50%);display:flex;gap:10px;color:#d7c8b4;font:700 .62rem var(--body);letter-spacing:.18em;text-transform:uppercase}.hero-scroll span{width:34px;height:1px;background:#d9b875}.stories-stage.vertical-stories{height:auto!important;top:auto!important;margin-top:35px;perspective:none}.stories-stage.vertical-stories::before{display:none!important}.vertical-stories .table-grid{display:grid!important;position:relative!important;grid-template-columns:minmax(0,1fr)!important;gap:0!important;height:auto!important;overflow:visible!important;margin:0!important}.vertical-stories .table-card{position:relative!important;left:auto!important;top:auto!important;width:min(900px,calc(100% - 90px))!important;height:min(74vh,720px)!important;margin:0 auto 24vh!important;padding:0!important;opacity:1!important;pointer-events:auto!important;transform:none!important;border:0!important;border-radius:3px!important;overflow:hidden!important;background:#1d3535!important;box-shadow:0 35px 80px rgba(32,51,58,.22)!important;scroll-margin-top:100px;transition:transform .7s ease,box-shadow .7s ease!important}.vertical-stories .table-card.is-current{transform:scale(1.015) rotateX(1deg)!important;box-shadow:0 45px 90px rgba(32,51,58,.28)!important}.vertical-stories .table-card img{width:100%!important;height:100%!important;object-fit:cover!important;transform:none!important}.vertical-stories .table-card-copy{position:absolute!important;left:0;right:0;bottom:0;padding:clamp(25px,5vw,55px)!important;color:#fffaf0!important;background:linear-gradient(180deg,transparent 0%,rgba(20,38,37,.06) 15%,rgba(20,38,37,.9) 100%)!important;z-index:5}.vertical-stories .table-card-copy small{color:#f0b49b!important;letter-spacing:.15em!important}.vertical-stories .table-card-copy h3{font-size:clamp(2.5rem,6vw,5rem)!important;line-height:.9!important}.vertical-stories .table-card-copy p{color:#f6eee2!important}.story-index{position:sticky;top:110px;float:right;width:58px;margin-right:0;z-index:20;display:flex;flex-direction:column;align-items:center;gap:8px}.story-index button{width:42px;height:34px;border:0;border-left:2px solid rgba(32,51,58,.14);background:transparent;color:var(--muted);font:700 .62rem var(--body);cursor:pointer;transition:all .2s ease}.story-index button:hover,.story-index button.is-active{color:var(--rust);border-left-color:var(--rust);transform:translateX(-3px)}.story-index button.is-active{font-size:.72rem}@media(max-width:760px){.table-hero{min-height:calc(100svh - 62px)}.table-hero-title{top:12%}.table-hero-title h1{font-size:clamp(3rem,14vw,5.2rem)}.hero-copy-left,.hero-copy-right{top:auto;bottom:16%;max-width:130px}.hero-copy-left{left:20px}.hero-copy-right{right:20px}.wood-table{width:96vw;transform:rotateX(58deg) rotateZ(-3deg) translateY(14%) scale(.9)}.hero-paper{width:120px;height:78px;padding:11px}.hero-paper b{font-size:.9rem}.hero-cup{width:52px;height:52px;right:13%;top:32%}.vertical-stories .table-card{width:100%!important;height:72svh!important;margin-bottom:18vh!important}.story-index{position:sticky;top:80px;float:none;width:100%;margin:0 0 18px;flex-direction:row;overflow-x:auto;justify-content:flex-start}.story-index button{flex:0 0 auto;border-left:0;border-bottom:2px solid rgba(32,51,58,.14)}.story-index button.is-active{border-bottom-color:var(--rust)}}
          </style>'''
          script='''<script id="table-experience-redesign-script">(()=>{const map=document.getElementById('map');if(map&&!document.querySelector('.table-hero')){const hero=document.createElement('section');hero.className='table-hero';hero.id='home-hero';hero.innerHTML=`<div class="table-hero-bg"></div><div class="table-hero-grid"></div><div class="table-hero-title"><span class="small">A visual archive of India at work</span><h1>The Great <em>Indian</em><br>Table</h1></div><div class="hero-copy-left"><span class="eyebrow">Not a database</span><p>Every table carries a livelihood, a routine, a place and a person.</p></div><div class="hero-copy-right"><span class="eyebrow">Made in India</span><p>From roadside counters to modern desks — this is where work happens.</p></div><div class="wood-table"><div class="wood-top"></div><div class="table-edge"></div><div class="table-leg one"></div><div class="table-leg two"></div><div class="table-object hero-paper"><b>THE TABLE</b><span>India / Everyday Work</span></div><div class="table-object hero-cup"></div></div><div class="hero-scroll"><span></span>Scroll to explore<span></span></div>`;map.parentNode.insertBefore(hero,map);const wood=hero.querySelector('.wood-table');if(!matchMedia('(prefers-reduced-motion: reduce)').matches){addEventListener('pointermove',e=>{const x=e.clientX/innerWidth-.5,y=e.clientY/innerHeight-.5;wood.style.transform=`rotateX(${58-y*5}deg) rotateZ(${-4+x*3}deg) translateY(15%) translateZ(${x*18}px)`},{passive:true});addEventListener('scroll',()=>{const p=Math.min(1,Math.max(0,(hero.getBoundingClientRect().bottom-innerHeight)/(innerHeight*.65)));wood.style.transform=`rotateX(${58-p*15}deg) rotateZ(${-4+p*3}deg) translateY(${15-p*18}%) translateZ(${-p*120}px) scale(${1-p*.14})`},{passive:true})}}const stage=document.querySelector('.stories-stage'),grid=document.getElementById('stories-grid');if(!stage||!grid)return;stage.classList.remove('immersive');stage.classList.add('vertical-stories');stage.style.cssText='';const cards=[...grid.querySelectorAll('.table-card')];const old=grid.querySelector('.story-counter');if(old)old.remove();cards.forEach((c,i)=>{c.id='story-card-'+i;c.classList.remove('is-current');c.removeAttribute('style')});const idx=document.createElement('div');idx.className='story-index';idx.innerHTML=cards.map((c,i)=>`<button type="button" data-jump="${i}" aria-label="Go to story ${i+1}">${String(i+1).padStart(2,'0')}</button>`).join('');grid.parentNode.insertBefore(idx,grid);const buttons=[...idx.children];buttons.forEach(b=>b.onclick=()=>cards[+b.dataset.jump].scrollIntoView({behavior:'smooth',block:'center'}));const io=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;const i=cards.indexOf(e.target);cards.forEach(c=>c.classList.remove('is-current'));e.target.classList.add('is-current');buttons.forEach((b,n)=>b.classList.toggle('is-active',n===i))}),{rootMargin:'-42% 0px -42% 0px'});cards.forEach(c=>io.observe(c));buttons[0]?.classList.add('is-active');cards[0]?.classList.add('is-current')})();</script>'''
          if 'id="table-experience-redesign"' not in h:h=h.replace('</head>',style+'\n</head>',1)
          if 'id="table-experience-redesign-script"' not in h:h=h.replace('</body>',script+'\n</body>',1)
          p.write_text(h,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Redesign landing hero and vertical stories"
          git push
