<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Great Indian Table</title>
  <meta name="description" content="A photographic archive of tables and the people who work at them across India.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    :root { --paper:#eee8dd; --ink:#1d211e; --muted:#6c7068; --line:rgba(29,33,30,.18); --dark:#151d1e; --warm:#c76a43; --display:'Libre Baskerville',Georgia,serif; --body:'DM Sans',Arial,sans-serif; --mono:'DM Mono',monospace; }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; background:var(--paper); }
    body { margin:0; background:var(--paper); color:var(--ink); font-family:var(--body); overflow-x:hidden; }
    body.is-ready { opacity:1; }
    a { color:inherit; text-decoration:none; }
    button { font:inherit; }
    .topline { position:fixed; z-index:20; top:0; left:0; right:0; display:flex; justify-content:space-between; align-items:center; padding:22px clamp(20px,4vw,64px); color:#f8f3e9; mix-blend-mode:difference; font:11px var(--mono); letter-spacing:.08em; text-transform:uppercase; pointer-events:none; }
    .topline strong { font:500 12px var(--mono); letter-spacing:.02em; }
    .hero { position:relative; min-height:100svh; display:grid; place-items:center; overflow:hidden; background:var(--dark); color:#f8f3e9; }
    .hero-media { position:absolute; inset:0; background:#242b29 url('assets/img/Hero.JPEG') center/cover no-repeat; transform:scale(1.04); filter:saturate(.82); transition:transform 1.4s cubic-bezier(.2,.7,.2,1),filter 1.2s ease; }
    .hero::after { content:""; position:absolute; inset:0; background:linear-gradient(180deg,rgba(10,15,14,.2),rgba(10,15,14,.62)); }
    .hero-copy { position:relative; z-index:1; width:min(950px,88vw); text-align:center; }
    .hero-kicker { margin:0 0 24px; font:11px var(--mono); letter-spacing:.14em; text-transform:uppercase; opacity:.82; }
    .hero h1 { max-width:900px; margin:0 auto; font:400 clamp(3.2rem,9vw,9.2rem)/.96 var(--display); letter-spacing:-.04em; }
    .hero h1 em { display:block; color:#e8b285; font-style:italic; }
    .hero-cta { display:inline-flex; align-items:center; gap:16px; margin-top:42px; padding:13px 0; border:0; border-bottom:1px solid rgba(248,243,233,.75); background:transparent; color:#f8f3e9; cursor:pointer; font:11px var(--mono); letter-spacing:.12em; text-transform:uppercase; transition:gap .25s ease,color .25s ease; }
    .hero-cta:hover { gap:24px; color:#e8b285; }
    .archive { background:var(--paper); }
    .archive-intro { display:flex; justify-content:space-between; gap:30px; align-items:baseline; max-width:1400px; margin:0 auto; padding:100px clamp(22px,5vw,78px) 34px; }
    .archive-intro h2 { margin:0; font:400 clamp(1.7rem,3vw,3rem)/1.1 var(--display); }
    .archive-intro p { max-width:370px; margin:0; color:var(--muted); font-size:.88rem; line-height:1.6; }
    .story { position:relative; min-height:100svh; display:grid; grid-template-columns:repeat(12,1fr); gap:clamp(18px,4vw,72px); align-items:center; max-width:1500px; margin:0 auto; padding:clamp(60px,9vw,125px) clamp(22px,5vw,78px); scroll-margin-top:20px; }
    .story::before { content:attr(data-number); position:absolute; top:34px; left:clamp(22px,5vw,78px); color:rgba(29,33,30,.34); font:11px var(--mono); letter-spacing:.12em; }
    .story-media { position:relative; grid-column:1 / span 8; grid-row:1; min-height:clamp(440px,66vh,760px); overflow:hidden; background:#d7d0c4; transform:translateY(28px) scale(.98); opacity:.72; filter:saturate(.78); transition:transform 1s cubic-bezier(.2,.7,.2,1),opacity 1s ease,filter 1s ease; }
    .story.is-visible .story-media { transform:translateY(0) scale(1); opacity:1; filter:saturate(1); }
    .story-media img { width:100%; height:100%; min-height:inherit; display:block; object-fit:cover; transition:transform 1.2s cubic-bezier(.2,.7,.2,1); }
    .story.is-visible .story-media img { transform:scale(1.035); }
    .story-info { grid-column:9 / -1; grid-row:1; align-self:end; padding-bottom:6%; opacity:0; transform:translateY(22px); transition:opacity .8s .12s ease,transform .8s .12s ease; }
    .story > .story-media, .story > .story-info { grid-row:1 !important; }
    .story.is-visible .story-info { opacity:1; transform:translateY(0); }
    .story-quote { margin:0 0 28px; font:italic clamp(1.05rem,1.7vw,1.65rem)/1.55 var(--display); }
    .story-name { margin:0 0 8px; font:500 .76rem var(--mono); letter-spacing:.1em; text-transform:uppercase; }
    .story-location { margin:0; color:var(--muted); font:11px var(--mono); letter-spacing:.04em; }
    .story:nth-of-type(odd) .story-media { grid-column:5 / -1; }
    .story:nth-of-type(odd) .story-info { grid-column:1 / span 3; grid-row:1; }
    .story:nth-of-type(4n) .story-media { grid-column:2 / span 9; min-height:clamp(480px,74vh,820px); }
    .story:nth-of-type(4n) .story-info { grid-column:10 / -1; grid-row:1; }
    .story.is-missing .story-media { display:grid; place-items:center; color:var(--muted); font:11px var(--mono); letter-spacing:.08em; text-transform:uppercase; }
    .end { min-height:70svh; display:grid; place-items:center; padding:90px 22px; background:var(--dark); color:#f8f3e9; text-align:center; }
    .end h2 { margin:0 0 18px; font:400 clamp(2.3rem,6vw,6rem)/1.05 var(--display); }
    .end p { margin:0 auto 30px; color:#bac0b8; font:italic 1rem var(--display); }
    .end button { border:0; border-bottom:1px solid #f8f3e9; padding:12px 0; background:none; color:#f8f3e9; cursor:pointer; font:11px var(--mono); letter-spacing:.12em; text-transform:uppercase; }
    .form-layer { position:fixed; inset:0; z-index:50; display:none; place-items:center; padding:22px; background:rgba(15,22,21,.72); backdrop-filter:blur(10px); }
    .form-layer.is-open { display:grid; }
    .form-card { position:relative; width:min(720px,100%); max-height:90svh; overflow:auto; padding:clamp(24px,5vw,52px); background:var(--paper); color:var(--ink); }
    .form-card h2 { margin:0 0 24px; font:400 clamp(1.8rem,4vw,3rem) var(--display); }
    .form-close { position:absolute; top:16px; right:16px; border:0; background:none; color:var(--ink); cursor:pointer; font-size:1.5rem; }
    .desk-form { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
    .desk-form label { display:grid; gap:6px; font-size:.72rem; }
    .desk-form .wide { grid-column:1 / -1; }
    .desk-form input,.desk-form textarea { width:100%; border:1px solid var(--line); border-radius:0; padding:11px; background:rgba(255,255,255,.35); color:var(--ink); font:inherit; }
    .desk-form textarea { min-height:80px; resize:vertical; }
    .desk-form button[type=submit] { grid-column:1 / -1; justify-self:start; border:0; padding:12px 18px; background:var(--ink); color:#f8f3e9; cursor:pointer; font:11px var(--mono); letter-spacing:.1em; text-transform:uppercase; }
    @media (max-width:800px) { .topline { padding:16px 18px; } .archive-intro { display:block; padding-top:74px; } .archive-intro p { margin-top:14px; } .story { min-height:auto; display:flex; flex-direction:column; align-items:stretch; gap:24px; padding:75px 20px 90px; } .story-media,.story:nth-of-type(odd) .story-media,.story:nth-of-type(4n) .story-media { order:0; min-height:64svh; } .story-info,.story:nth-of-type(odd) .story-info,.story:nth-of-type(4n) .story-info { order:1; padding:0 8px; } .story-quote { font-size:1.1rem; } .desk-form { grid-template-columns:1fr; } .desk-form .wide { grid-column:auto; } }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:.01ms!important; transition-duration:.01ms!important; scroll-behavior:auto!important; } .story-media,.story-info { opacity:1; transform:none; filter:none; } }
  </style>
</head>
<body>
  <header class="topline"><strong>The Great Indian Table</strong><span id="counter">00 / 16</span></header>
  <main>
    <section class="hero" id="top">
      <div class="hero-media" aria-hidden="true"></div>
      <div class="hero-copy"><p class="hero-kicker">A photographic archive of where India works</p><h1>The Great Indian <em>Table</em></h1><button class="hero-cta" type="button" data-explore>Explore tables <span>→</span></button></div>
    </section>
    <section class="archive" id="stories" aria-label="Stories archive"><div class="archive-intro"><h2>The stories are in the details.</h2><p>Sixteen tables, desks, benches and workspaces. Each one holds a life in progress.</p></div><div id="story-list"></div></section>
    <section class="end"><div><h2>The table goes on.</h2><p>Have a table worth remembering?</p><button type="button" data-form-open>Add your table <span>→</span></button></div></section>
  </main>
  <div class="form-layer" id="form-layer" aria-hidden="true"><div class="form-card" role="dialog" aria-modal="true" aria-labelledby="form-title"><button class="form-close" type="button" data-form-close aria-label="Close form">×</button><h2 id="form-title">Add your table.</h2><form class="desk-form" action="https://script.google.com/macros/s/AKfycbzH3lsZbOfXM__5Bvlfx-9mpOtighO1RFt-iMFaBO4QGd-ARskMFF32XCYcRliAeW6-/exec" method="post" target="desk-submit-target"><label>Name<input name="name" required></label><label>Profession<input name="profession" required></label><label>City<input name="city" required></label><label>State<input name="state" required></label><label class="wide">Tell us about the table<textarea name="intro" required></textarea></label><label>Typical workday<textarea name="workday" required></textarea></label><label>The challenge<textarea name="challenge" required></textarea></label><label>The dream<textarea name="dream" required></textarea></label><label>Quote<textarea name="quote" required></textarea></label><label>Interesting object<textarea name="interesting_object"></textarea></label><label class="wide"><span><input type="checkbox" name="consent" required> I have permission to share this story.</span></label><button type="submit">Submit your table</button></form></div></div>
  <iframe name="desk-submit-target" title="Submission response" hidden></iframe>
  <script src="assets/stories.js"></script>
  <script>
    (() => {
      const stories = Array.isArray(window.STORIES) ? window.STORIES : [];
      const list = document.getElementById('story-list');
      const esc = value => String(value || '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
      document.getElementById('counter').textContent = `00 / ${String(stories.length).padStart(2,'0')}`;
      list.innerHTML = stories.map((story,index) => `<article class="story${story.image ? '' : ' is-missing'}" data-number="${String(index + 1).padStart(2,'0')} / ${String(stories.length).padStart(2,'0')}" data-story-index="${index}"><div class="story-media">${story.image ? `<img src="${esc(story.image)}" alt="${esc(story.name)} workspace" loading="lazy">` : '<span>Image awaiting confirmed mapping</span>'}</div><div class="story-info"><p class="story-quote">“${esc(story.quote)}”</p><h3 class="story-name">${esc(story.name)}</h3><p class="story-location">${esc(story.location)}</p></div></article>`).join('');
      const storiesObserver = new IntersectionObserver(entries => entries.forEach(entry => { if (!entry.isIntersecting) return; entry.target.classList.add('is-visible'); const index = Number(entry.target.dataset.storyIndex) + 1; document.getElementById('counter').textContent = `${String(index).padStart(2,'0')} / ${String(stories.length).padStart(2,'0')}`; }), { threshold:.35 });
      document.querySelectorAll('.story').forEach(story => storiesObserver.observe(story));
      document.querySelector('[data-explore]').addEventListener('click', () => { document.getElementById('stories').scrollIntoView({behavior:'smooth'}); document.querySelector('.hero-media').style.transform = 'scale(1.16)'; });
      const formLayer = document.getElementById('form-layer');
      const setForm = open => { formLayer.classList.toggle('is-open',open); formLayer.setAttribute('aria-hidden',String(!open)); document.body.style.overflow = open ? 'hidden' : ''; if (open) formLayer.querySelector('input').focus(); };
      document.querySelector('[data-form-open]').addEventListener('click', () => setForm(true));
      document.querySelector('[data-form-close]').addEventListener('click', () => setForm(false));
      formLayer.addEventListener('click', event => { if (event.target === formLayer) setForm(false); });
      document.addEventListener('keydown', event => { if (event.key === 'Escape') setForm(false); });
      document.querySelectorAll('img').forEach(image => image.addEventListener('error', () => { image.closest('.story-media')?.classList.add('is-missing'); image.replaceWith(Object.assign(document.createElement('span'), {textContent:'Image unavailable'})); }, {once:true}));
    })();
  </script>
</body>
</html>
