<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Great Indian Table</title>
<meta name="description" content="A photographic archive of tables and the people who work at them across India.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{--paper:#eee8dd;--ink:#1d211e;--dark:#101615;--accent:#ef9a7e;--cream:#f8f3e9;--display:'Libre Baskerville',Georgia,serif;--body:'DM Sans',Arial,sans-serif;--mono:'DM Mono',monospace}
*{box-sizing:border-box}html,body{margin:0;background:var(--dark);color:var(--cream);font-family:var(--body);overflow:hidden}button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}a{text-decoration:none;color:inherit}
.hero{position:fixed;inset:0;display:grid;place-items:center;background:var(--dark);overflow:hidden}.hero-media{position:absolute;inset:-3%;background:url('assets/img/Hero.JPEG') center/cover no-repeat;filter:saturate(.78);transform:scale(1.04);transition:transform 1.6s cubic-bezier(.2,.7,.2,1)}.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,12,11,.18),rgba(8,12,11,.72))}.hero-copy{position:relative;z-index:1;width:min(980px,88vw);text-align:center}.hero-kicker{margin:0 0 24px;font:11px var(--mono);letter-spacing:.15em;text-transform:uppercase;opacity:.85}.hero h1{margin:0;font:400 clamp(3.2rem,9vw,9.2rem)/.94 var(--display);letter-spacing:-.045em}.hero h1 em{display:block;color:#e8b285;font-style:italic}.hero-cta{display:inline-flex;gap:16px;margin-top:42px;padding:13px 0;border-bottom:1px solid rgba(248,243,233,.7);font:11px var(--mono);letter-spacing:.12em;text-transform:uppercase}
.archive{position:fixed;inset:0;z-index:10;display:none;background:var(--dark);overflow:hidden}.is-stories .archive{display:block}.is-stories .hero{display:none}.archive-intro{position:absolute;z-index:20;top:22px;left:0;right:0;display:flex;justify-content:center;align-items:center;pointer-events:none}.archive-intro h2{margin:0;color:#aeb8b0;font:500 10px var(--mono);letter-spacing:.2em;text-transform:uppercase}.home-link{position:absolute;left:clamp(20px,5vw,78px);pointer-events:auto;color:#aeb8b0;font:11px var(--mono);letter-spacing:.1em;text-transform:uppercase}.story-viewer{position:absolute;inset:0}.viewer-media{position:absolute;inset:0;background:#1d2422;overflow:hidden}.viewer-media:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(8,12,11,.16),rgba(8,12,11,.02) 52%,rgba(8,12,11,.05)),linear-gradient(0deg,rgba(8,12,11,.78),transparent 38%,rgba(8,12,11,.16));pointer-events:none}.viewer-media img{width:100%;height:100%;display:block;object-fit:cover;transform:scale(1.015);transition:opacity .42s ease,transform 1.1s cubic-bezier(.2,.7,.2,1)}.viewer-media.is-changing img{opacity:0;transform:scale(1.05)}
.viewer-info{position:absolute;z-index:4;left:clamp(24px,6vw,96px);bottom:clamp(112px,13vh,154px);width:min(760px,58vw);text-shadow:0 2px 22px rgba(0,0,0,.42)}.viewer-profession{margin:0 0 8px;font:500 10px var(--mono);letter-spacing:.18em;text-transform:uppercase;color:#e7ece7}.viewer-name{margin:0 0 11px;font:500 clamp(.72rem,.9vw,.95rem)/1.2 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:#eef2ed}.viewer-quote{margin:0 0 9px;max-width:720px;font:italic clamp(2.2rem,4vw,4.4rem)/1.08 var(--display);letter-spacing:-.03em;color:#fff}.viewer-location{margin:0;color:#d1d7d1;font:9px var(--mono);letter-spacing:.06em}.viewer-actions{display:flex;align-items:center;gap:18px;margin-top:16px}.viewer-arrow{font-size:1.7rem;line-height:1}.viewer-listen{display:none}
.spotify-player{position:absolute;z-index:8;right:clamp(20px,4vw,64px);bottom:clamp(92px,10vh,120px);width:min(390px,31vw);height:80px;border:0;border-radius:12px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.24);opacity:.96}.spotify-player iframe{display:block;width:100%;height:80px;border:0}
.story-thumbs{position:absolute;z-index:12;left:clamp(20px,6vw,96px);right:clamp(20px,6vw,96px);bottom:25px;display:flex;gap:9px;overflow-x:auto;padding:8px 4px 10px;scrollbar-width:none}.story-thumbs::-webkit-scrollbar{display:none}.story-thumb{position:relative;flex:0 0 78px;height:52px;overflow:hidden;border:1px solid rgba(248,243,233,.27);background:#293330;opacity:.48}.story-thumb img{width:100%;height:100%;display:block;object-fit:cover}.story-thumb span{position:absolute;left:5px;bottom:4px;font:8px var(--mono);text-shadow:0 1px 5px #000}.story-thumb.is-active{opacity:1;border-color:var(--accent);transform:translateY(-5px)}
@media(max-width:1000px){.spotify-player{width:min(360px,38vw)}}
@media(max-width:800px){.archive-intro{top:17px}.home-link{left:18px}.viewer-media:after{background:linear-gradient(180deg,rgba(8,12,11,.22),rgba(8,12,11,.03) 32%,rgba(8,12,11,.78) 67%,rgba(8,12,11,.94))}.viewer-info{left:20px;right:20px;bottom:188px;width:auto}.viewer-name{font-size:9px}.viewer-quote{font-size:1.75rem;line-height:1.12}.viewer-actions{margin-top:12px}.spotify-player{left:18px;right:18px;bottom:82px;width:auto;height:80px}.story-thumbs{left:14px;right:14px;bottom:17px}.story-thumb{flex-basis:62px;height:42px}}
</style>
</head>
<body>
<section class="hero" id="top"><div class="hero-media" aria-hidden="true"></div><div class="hero-copy"><p class="hero-kicker">A photographic archive of where India works</p><h1>The Great Indian <em>Table</em></h1><button class="hero-cta" type="button" data-explore>Enter the tables <span>→</span></button></div></section>
<section class="archive" id="stories" aria-label="Full-screen table stories"><div class="archive-intro"><button class="home-link" type="button" data-home>← Home</button><h2>The stories are in the details.</h2></div><div class="story-viewer"><div class="viewer-media" id="viewer-media"></div><div class="viewer-info"><p class="viewer-profession" id="viewer-profession"></p><h2 class="viewer-name" id="viewer-name"></h2><p class="viewer-quote" id="viewer-quote"></p><p class="viewer-location" id="viewer-location"></p><div class="viewer-actions"><button class="viewer-arrow" type="button" data-slide="-1" aria-label="Previous story">←</button><button class="viewer-arrow" type="button" data-slide="1" aria-label="Next story">→</button></div></div><div class="spotify-player" id="spotify-player" aria-label="Spotify table soundtrack"></div></div><div class="story-thumbs" id="story-thumbs" aria-label="Choose a story"></div></section>
<div class="form-layer" id="form-layer" aria-hidden="true"></div>
<script src="assets/stories.js"></script>
<script src="https://open.spotify.com/embed/iframe-api/v1" async></script>
<script>
(()=>{const stories=Array.isArray(window.STORIES)?window.STORIES:[];const esc=v=>String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const media=document.getElementById('viewer-media'),thumbs=document.getElementById('story-thumbs'),spotifyHost=document.getElementById('spotify-player');let activeIndex=0,total=stories.length;let spotifyController=null;let spotifyReady=false;
function initSpotify(IFrameAPI){if(spotifyReady)return;spotifyReady=true;spotifyHost.replaceChildren();const options={width:'100%',height:80,url:'https://open.spotify.com/playlist/656d91JastxforR4ac4eIs'};IFrameAPI.createController(spotifyHost,options,controller=>{spotifyController=controller;});}
window.onSpotifyIframeApiReady=initSpotify;
function renderThumbs(){thumbs.innerHTML=stories.map((s,i)=>`<button class="story-thumb${i===activeIndex?' is-active':''}" type="button" data-thumb="${i}" aria-label="View ${esc(s.name)}">${s.image?`<img src="${esc(s.image)}" alt="">`:''}<span>${String(i+1).padStart(2,'0')}</span></button>`).join('');thumbs.querySelectorAll('[data-thumb]').forEach(b=>b.addEventListener('click',()=>showStory(Number(b.dataset.thumb))));}
function showStory(index){if(!total)return;activeIndex=(index+total)%total;const s=stories[activeIndex];document.getElementById('viewer-profession').textContent=s.profession||'';document.getElementById('viewer-name').textContent=s.name||'';document.getElementById('viewer-quote').textContent=s.quote?`“${s.quote}”`:'';document.getElementById('viewer-location').textContent=s.location||'';media.classList.add('is-changing');setTimeout(()=>{media.innerHTML=s.image?`<img src="${esc(s.image)}" alt="${esc(s.name)}'s table in ${esc(s.location)}">`:'<div class="viewer-missing">Image awaiting confirmed mapping</div>';requestAnimationFrame(()=>media.classList.remove('is-changing'));},180);renderThumbs();thumbs.querySelector(`[data-thumb="${activeIndex}"]`)?.scrollIntoView({block:'nearest',inline:'center',behavior:'smooth'});}
function enter(){document.body.classList.add('is-stories');document.querySelector('.hero-media').style.transform='scale(1.14)';showStory(0)}
document.querySelector('[data-explore]').addEventListener('click',enter);document.querySelectorAll('[data-slide]').forEach(b=>b.addEventListener('click',()=>showStory(activeIndex+Number(b.dataset.slide))));document.querySelector('[data-home]').addEventListener('click',()=>document.body.classList.remove('is-stories'));document.addEventListener('keydown',e=>{if(!document.body.classList.contains('is-stories'))return;if(e.key==='ArrowRight')showStory(activeIndex+1);if(e.key==='ArrowLeft')showStory(activeIndex-1);if(e.key==='Escape')document.body.classList.remove('is-stories')});let wheelTimer=0;document.addEventListener('wheel',e=>{if(!document.body.classList.contains('is-stories')||Date.now()<wheelTimer||Math.abs(e.deltaY)<18)return;wheelTimer=Date.now()+700;showStory(activeIndex+(e.deltaY>0?1:-1))},{passive:true});let touchY=0;document.addEventListener('touchstart',e=>{if(document.body.classList.contains('is-stories'))touchY=e.changedTouches[0].clientY},{passive:true});document.addEventListener('touchend',e=>{if(!document.body.classList.contains('is-stories'))return;const dy=touchY-e.changedTouches[0].clientY;if(Math.abs(dy)>45)showStory(activeIndex+(dy>0?1:-1))},{passive:true});renderThumbs();if(total)showStory(0);})();
</script>
</body>
</html>
