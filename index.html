<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Great Indian Table</title>
<meta name="description" content="A photographic archive of tables and the people who work at them across India.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{--paper:#eee8dd;--ink:#1d211e;--muted:#b4bbb3;--dark:#101615;--accent:#ef9a7e;--cream:#f8f3e9;--display:'Libre Baskerville',Georgia,serif;--body:'DM Sans',Arial,sans-serif;--mono:'DM Mono',monospace}
*{box-sizing:border-box}html,body{margin:0;background:var(--dark);color:var(--cream);font-family:var(--body);overflow:hidden}button,a{font:inherit;color:inherit}button{border:0;background:none;cursor:pointer}a{text-decoration:none}
.hero{position:fixed;inset:0;display:grid;place-items:center;background:var(--dark);overflow:hidden}.hero-media{position:absolute;inset:-3%;background:url('assets/img/Hero.JPEG') center/cover no-repeat;filter:saturate(.78);transform:scale(1.04);transition:transform 1.6s cubic-bezier(.2,.7,.2,1)}.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,12,11,.18),rgba(8,12,11,.72))}.hero-copy{position:relative;z-index:1;width:min(980px,88vw);text-align:center}.hero-kicker{margin:0 0 24px;font:11px var(--mono);letter-spacing:.15em;text-transform:uppercase;opacity:.85}.hero h1{margin:0;font:400 clamp(3.2rem,9vw,9.2rem)/.94 var(--display);letter-spacing:-.045em}.hero h1 em{display:block;color:#e8b285;font-style:italic}.hero-cta{display:inline-flex;gap:16px;margin-top:42px;padding:13px 0;border-bottom:1px solid rgba(248,243,233,.7);font:11px var(--mono);letter-spacing:.12em;text-transform:uppercase;transition:gap .25s,color .25s}.hero-cta:hover{gap:24px;color:var(--accent)}
.archive{position:fixed;inset:0;z-index:10;display:none;background:var(--dark);overflow:hidden}.is-stories .archive{display:block}.is-stories .hero{display:none}.topline{position:fixed;z-index:30;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:22px clamp(20px,4vw,64px);pointer-events:none;color:var(--cream);mix-blend-mode:difference}.topline strong{font:500 12px var(--mono);letter-spacing:.03em;text-transform:uppercase}.topline #counter{font:11px var(--mono);letter-spacing:.1em}
.archive-intro{position:absolute;z-index:5;top:22px;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:22px;pointer-events:none}.archive-intro h2{margin:0;color:#aeb8b0;font:500 10px var(--mono);letter-spacing:.2em;text-transform:uppercase}.home-link{position:absolute;left:clamp(20px,5vw,78px);pointer-events:auto;color:#aeb8b0;font:11px var(--mono);letter-spacing:.1em;text-transform:uppercase;transition:color .2s}.home-link:hover{color:var(--cream)}
.story-viewer{position:absolute;inset:0}.viewer-media{position:absolute;inset:0;background:#1d2422;overflow:hidden}.viewer-media:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(8,12,11,.16) 0%,rgba(8,12,11,.02) 52%,rgba(8,12,11,.05) 100%),linear-gradient(0deg,rgba(8,12,11,.78) 0%,transparent 38%,rgba(8,12,11,.16) 100%);pointer-events:none}.viewer-media img{width:100%;height:100%;display:block;object-fit:cover;transform:scale(1.015);transition:opacity .42s ease,transform 1.1s cubic-bezier(.2,.7,.2,1)}.viewer-media.is-changing img{opacity:0;transform:scale(1.05)}.viewer-missing{height:100%;display:grid;place-items:center;color:#aeb8b0;font:11px var(--mono);letter-spacing:.08em;text-transform:uppercase}
.viewer-info{position:absolute;z-index:4;left:clamp(24px,6vw,96px);bottom:clamp(112px,13vh,154px);top:auto;width:min(760px,58vw);transform:none;text-shadow:0 2px 22px rgba(0,0,0,.42)}.viewer-number{margin:0 0 14px;color:var(--accent);font:11px var(--mono);letter-spacing:.12em}.viewer-profession{margin:0 0 12px;font:500 10px var(--mono);letter-spacing:.18em;text-transform:uppercase;color:#e7ece7}.viewer-name{margin:0 0 13px;font:500 clamp(.85rem,1.05vw,1.05rem)/1.2 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:#eef2ed}.viewer-quote{margin:0 0 11px;max-width:720px;font:italic clamp(1.75rem,3.05vw,3.45rem)/1.12 var(--display);letter-spacing:-.025em;color:#fff}.viewer-location{margin:0;color:#d1d7d1;font:10px var(--mono);letter-spacing:.06em}.viewer-actions{display:flex;align-items:center;gap:20px;margin-top:20px}.viewer-arrow{font-size:1.7rem;line-height:1;transition:color .2s,transform .2s}.viewer-arrow:hover{color:var(--accent)}.viewer-arrow[data-slide="1"]:hover{transform:translateX(4px)}.viewer-arrow[data-slide="-1"]:hover{transform:translateX(-4px)}.viewer-listen{display:inline-flex;align-items:center;gap:11px;padding:10px 14px;border:1px solid rgba(248,243,233,.42);background:rgba(15,22,21,.26);backdrop-filter:blur(10px);font:10px var(--mono);letter-spacing:.1em;text-transform:uppercase;transition:background .25s,border-color .25s}.viewer-listen:hover{background:rgba(15,22,21,.7);border-color:var(--accent)}.viewer-listen .play{color:var(--accent);font-size:13px}.viewer-listen.is-disabled{opacity:.7;cursor:default}.viewer-listen.is-disabled:hover{background:rgba(15,22,21,.26);border-color:rgba(248,243,233,.42)}
.spotify-player{position:absolute;z-index:8;right:clamp(20px,4vw,64px);bottom:clamp(92px,10vh,120px);width:min(390px,31vw);height:152px;border:0;border-radius:12px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.24);opacity:.96;transition:opacity .25s,transform .25s}.spotify-player:hover{opacity:1;transform:translateY(-2px)}.spotify-player iframe{display:block;width:100%;height:152px;border:0}
.story-thumbs{position:absolute;z-index:6;left:clamp(20px,6vw,96px);right:clamp(20px,6vw,96px);bottom:25px;display:flex;gap:9px;overflow-x:auto;padding:8px 4px 10px;scrollbar-width:none}.story-thumbs::-webkit-scrollbar{display:none}.story-thumb{position:relative;flex:0 0 78px;height:52px;overflow:hidden;border:1px solid rgba(248,243,233,.27);background:#293330;opacity:.48;transition:opacity .25s,transform .25s,border-color .25s}.story-thumb img{width:100%;height:100%;display:block;object-fit:cover}.story-thumb span{position:absolute;left:5px;bottom:4px;font:8px var(--mono);text-shadow:0 1px 5px #000}.story-thumb.is-active{opacity:1;border-color:var(--accent);transform:translateY(-5px)}
.viewer-sound{position:absolute;z-index:5;right:clamp(20px,5vw,78px);bottom:102px;display:flex;align-items:center;gap:9px;color:#cbd1cb;font:9px var(--mono);letter-spacing:.11em;text-transform:uppercase}.sound-bars{display:flex;align-items:flex-end;height:14px;gap:2px}.sound-bars i{display:block;width:2px;height:6px;background:var(--accent);animation:pulse 1s ease-in-out infinite}.sound-bars i:nth-child(2){height:11px;animation-delay:.15s}.sound-bars i:nth-child(3){height:8px;animation-delay:.3s}@keyframes pulse{50%{transform:scaleY(.45)}}
.form-layer{position:fixed;inset:0;z-index:50;display:none;place-items:center;padding:22px;background:rgba(15,22,21,.78);backdrop-filter:blur(12px)}.form-layer.is-open{display:grid}.form-card{position:relative;width:min(720px,100%);max-height:90svh;overflow:auto;padding:clamp(24px,5vw,52px);background:var(--paper);color:var(--ink)}.form-card h2{margin:0 0 24px;font:400 clamp(1.8rem,4vw,3rem) var(--display)}.form-close{position:absolute;top:16px;right:16px;font-size:1.5rem}.desk-form{display:grid;grid-template-columns:1fr 1fr;gap:14px}.desk-form label{display:grid;gap:6px;font-size:.72rem}.desk-form .wide{grid-column:1/-1}.desk-form input,.desk-form textarea{width:100%;border:1px solid rgba(29,33,30,.18);border-radius:0;padding:11px;background:rgba(255,255,255,.35);color:var(--ink);font:inherit}.desk-form textarea{min-height:80px;resize:vertical}.desk-form button[type=submit]{grid-column:1/-1;justify-self:start;border:0;padding:12px 18px;background:var(--ink);color:var(--cream);font:11px var(--mono);letter-spacing:.1em;text-transform:uppercase}
@media(max-width:1000px){.spotify-player{width:min(360px,38vw)}}
@media(max-width:800px){.topline{padding:16px 18px}.topline strong{font-size:10px}.archive-intro{top:17px}.home-link{left:18px}.viewer-media:after{background:linear-gradient(180deg,rgba(8,12,11,.22),rgba(8,12,11,.03) 32%,rgba(8,12,11,.78) 67%,rgba(8,12,11,.94))}.viewer-info{left:20px;right:20px;top:auto;bottom:282px;width:auto;transform:none}.viewer-number{margin-bottom:10px}.viewer-profession{margin-bottom:8px}.viewer-name{margin-bottom:9px;font-size:10px}.viewer-quote{margin-bottom:8px;font-size:1.55rem;line-height:1.14;max-width:620px}.viewer-location{font-size:9px}.viewer-actions{margin-top:13px;gap:15px}.viewer-listen{padding:9px 12px}.spotify-player{left:18px;right:18px;bottom:88px;width:auto;height:152px}.story-thumbs{left:14px;right:14px;bottom:17px;gap:7px}.story-thumb{flex-basis:62px;height:42px}.viewer-sound{right:18px;bottom:248px;font-size:8px}.desk-form{grid-template-columns:1fr}.desk-form .wide{grid-column:auto}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<header class="topline"><strong>The Great Indian Table</strong><span id="counter">00 / 16</span></header>
<section class="hero" id="top"><div class="hero-media" aria-hidden="true"></div><div class="hero-copy"><p class="hero-kicker">A photographic archive of where India works</p><h1>The Great Indian <em>Table</em></h1><button class="hero-cta" type="button" data-explore>Enter the tables <span>→</span></button></div></section>
<section class="archive" id="stories" aria-label="Full-screen table stories"><div class="archive-intro"><button class="home-link" type="button" data-home>← Home</button><h2>The stories are in the details.</h2></div><div class="story-viewer"><div class="viewer-media" id="viewer-media"></div><div class="viewer-info"><p class="viewer-number" id="viewer-number">01 / 16</p><p class="viewer-profession" id="viewer-profession"></p><h2 class="viewer-name" id="viewer-name"></h2><p class="viewer-quote" id="viewer-quote"></p><p class="viewer-location" id="viewer-location"></p><div class="viewer-actions"><button class="viewer-arrow" type="button" data-slide="-1" aria-label="Previous story">←</button><button class="viewer-arrow" type="button" data-slide="1" aria-label="Next story">→</button><a class="viewer-listen" id="viewer-listen" href="#" target="_blank" rel="noopener"><span class="play">▶</span><span id="viewer-listen-label">Open playlist</span></a></div></div><div class="spotify-player" id="spotify-player" aria-label="Spotify table soundtrack"><iframe title="Table soundtrack" src="https://open.spotify.com/embed/playlist/656d91JastxforR4ac4eIs?utm_source=generator&theme=0&si=8badbfd549984ae7" width="100%" height="152" frameborder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe></div><div class="viewer-sound" id="viewer-sound"><span class="sound-bars"><i></i><i></i><i></i></span><span>Table soundtrack</span></div></div><div class="story-thumbs" id="story-thumbs" aria-label="Choose a story"></div></section>
<div class="form-layer" id="form-layer" aria-hidden="true"><div class="form-card" role="dialog" aria-modal="true" aria-labelledby="form-title"><button class="form-close" type="button" data-form-close aria-label="Close form">×</button><h2 id="form-title">Add your table.</h2><form class="desk-form" action="https://script.google.com/macros/s/AKfycbzH3lsZbOfXM__5Bvlfx-9mpOtighO1RFt-iMFaBO4QGd-ARskMFF32XCYcRliAeW6-/exec" method="post" target="desk-submit-target"><label>Name<input name="name" required></label><label>Profession<input name="profession" required></label><label>City<input name="city" required></label><label>State<input name="state" required></label><label class="wide">Tell us about the table<textarea name="intro" required></textarea></label><label>Typical workday<textarea name="workday" required></textarea></label><label>The challenge<textarea name="challenge" required></textarea></label><label>The dream<textarea name="dream" required></textarea></label><label>Quote<textarea name="quote" required></textarea></label><label>Interesting object<textarea name="interesting_object"></textarea></label><label class="wide"><span><input type="checkbox" name="consent" required> I have permission to share this story.</span></label><button type="submit">Submit your table</button></form></div></div>
<iframe name="desk-submit-target" title="Submission response" hidden></iframe>
<script src="assets/stories.js"></script>
<script>
(()=>{
const stories=Array.isArray(window.STORIES)?window.STORIES:[];const esc=v=>String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const counter=document.getElementById('counter'),media=document.getElementById('viewer-media'),thumbs=document.getElementById('story-thumbs'),listen=document.getElementById('viewer-listen'),listenLabel=document.getElementById('viewer-listen-label');let activeIndex=0;
const total=stories.length;counter.textContent=`00 / ${String(total).padStart(2,'0')}`;
function renderThumbs(){thumbs.innerHTML=stories.map((s,i)=>`<button class="story-thumb${i===activeIndex?' is-active':''}" type="button" data-thumb="${i}" aria-label="View ${esc(s.name)}">${s.image?`<img src="${esc(s.image)}" alt="">`:''}<span>${String(i+1).padStart(2,'0')}</span></button>`).join('');thumbs.querySelectorAll('[data-thumb]').forEach(b=>b.addEventListener('click',()=>showStory(Number(b.dataset.thumb))));}
function setListen(story){const url=story.spotifyUrl||story.spotify?.url||'https://open.spotify.com/embed/playlist/656d91JastxforR4ac4eIs?utm_source=generator&theme=0&si=8badbfd549984ae7';const label=story.spotifyLabel||story.spotify?.label||'Open playlist';listen.href=url;listen.classList.remove('is-disabled');listen.removeAttribute('aria-disabled');listenLabel.textContent=label}
function showStory(index){if(!total)return;activeIndex=(index+total)%total;const s=stories[activeIndex];document.getElementById('viewer-number').textContent=`${String(activeIndex+1).padStart(2,'0')} / ${String(total).padStart(2,'0')}`;counter.textContent=`${String(activeIndex+1).padStart(2,'0')} / ${String(total).padStart(2,'0')}`;document.getElementById('viewer-profession').textContent=s.profession||'';document.getElementById('viewer-name').textContent=s.name||'';document.getElementById('viewer-quote').textContent=s.quote?`“${s.quote}”`:'';document.getElementById('viewer-location').textContent=s.location||'';setListen(s);media.classList.add('is-changing');setTimeout(()=>{media.innerHTML=s.image?`<img src="${esc(s.image)}" alt="${esc(s.name)}'s table in ${esc(s.location)}">`:'<div class="viewer-missing">Image awaiting confirmed mapping</div>';requestAnimationFrame(()=>media.classList.remove('is-changing'));},180);renderThumbs();thumbs.querySelector(`[data-thumb="${activeIndex}"]`)?.scrollIntoView({block:'nearest',inline:'center',behavior:'smooth'});}
function enter(){document.body.classList.add('is-stories');document.querySelector('.hero-media').style.transform='scale(1.14)';showStory(0)}
document.querySelector('[data-explore]').addEventListener('click',enter);document.querySelectorAll('[data-slide]').forEach(b=>b.addEventListener('click',()=>showStory(activeIndex+Number(b.dataset.slide))));document.querySelectorAll('[data-home]').forEach(b=>b.addEventListener('click',()=>document.body.classList.remove('is-stories')));
document.addEventListener('keydown',e=>{if(!document.body.classList.contains('is-stories'))return;if(e.key==='ArrowRight')showStory(activeIndex+1);if(e.key==='ArrowLeft')showStory(activeIndex-1);if(e.key==='Escape')document.body.classList.remove('is-stories')});
let wheelTimer=0;document.addEventListener('wheel',e=>{if(!document.body.classList.contains('is-stories')||Date.now()<wheelTimer)return;if(Math.abs(e.deltaY)<18)return;wheelTimer=Date.now()+700;showStory(activeIndex+(e.deltaY>0?1:-1))},{passive:true});
let touchY=0;document.addEventListener('touchstart',e=>{if(document.body.classList.contains('is-stories'))touchY=e.changedTouches[0].clientY},{passive:true});document.addEventListener('touchend',e=>{if(!document.body.classList.contains('is-stories'))return;const dy=touchY-e.changedTouches[0].clientY;if(Math.abs(dy)>45)showStory(activeIndex+(dy>0?1:-1))},{passive:true});
const formLayer=document.getElementById('form-layer');const setForm=open=>{formLayer.classList.toggle('is-open',open);formLayer.setAttribute('aria-hidden',String(!open));if(open)formLayer.querySelector('input').focus()};document.addEventListener('keydown',e=>{if(e.key==='Escape')setForm(false)});document.querySelector('[data-form-close]').addEventListener('click',()=>setForm(false));formLayer.addEventListener('click',e=>{if(e.target===formLayer)setForm(false)});
renderThumbs();if(total)showStory(0);
})();
</script>
</body>
</html>
