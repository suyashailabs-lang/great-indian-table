<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>The Great Indian Table</title><meta name="description" content="A photographic archive of tables and the people who work at them across India."><meta name="archive-build" content="2026-09-11-5"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet"><style>
:root{--dark:#101615;--accent:#ef9a7e;--cream:#f8f3e9;--display:'Libre Baskerville',Georgia,serif;--body:'DM Sans',Arial,sans-serif;--mono:'DM Mono',monospace}*{box-sizing:border-box}html,body{margin:0;background:var(--dark);color:var(--cream);font-family:var(--body);overflow:hidden}button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}.hero{position:fixed;inset:0;display:grid;place-items:center;background:var(--dark);overflow:hidden}.hero-media{position:absolute;inset:-3%;background:url('assets/img/Hero.JPEG') center/cover no-repeat;filter:saturate(.78);transform:scale(1.04);transition:transform 1.6s cubic-bezier(.2,.7,.2,1)}.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,12,11,.18),rgba(8,12,11,.72))}.hero-copy{position:relative;z-index:1;width:min(980px,88vw);text-align:center}.hero-kicker{margin:0 0 24px;font:11px var(--mono);letter-spacing:.15em;text-transform:uppercase;opacity:.85}.hero h1{margin:0;font:400 clamp(3.2rem,9vw,9.2rem)/.94 var(--display);letter-spacing:-.045em}.hero h1 em{display:block;color:#e8b285;font-style:italic}.hero-cta{display:inline-flex;gap:16px;margin-top:42px;padding:13px 0;border-bottom:1px solid rgba(248,243,233,.7);font:11px var(--mono);letter-spacing:.12em;text-transform:uppercase}.archive{position:fixed;inset:0;z-index:10;display:none;background:var(--dark);overflow:hidden}.is-stories .archive{display:block}.is-stories .hero{display:none}.archive-intro{position:absolute;z-index:20;top:22px;left:0;right:0;display:flex;justify-content:center;align-items:center;pointer-events:none}.archive-intro h2{margin:0;color:#aeb8b0;font:500 10px var(--mono);letter-spacing:.2em;text-transform:uppercase}.home-link{position:absolute;left:clamp(20px,5vw,78px);pointer-events:auto;color:#aeb8b0;font:11px var(--mono);letter-spacing:.1em;text-transform:uppercase}.story-viewer{position:absolute;inset:0}.viewer-media{position:absolute;inset:0;background:#1d2422;overflow:hidden}.viewer-media:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,12,11,.16),rgba(8,12,11,.02) 42%,rgba(8,12,11,.10) 62%,rgba(8,12,11,.68) 100%);pointer-events:none;z-index:3}.viewer-media img{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:cover;transform:scale(1.015);opacity:1;transition:opacity .75s cubic-bezier(.22,.61,.36,1),transform 1.25s cubic-bezier(.2,.7,.2,1),filter .75s ease}.viewer-media img.is-old{opacity:0;transform:scale(1.035) translateX(-18px);filter:blur(1px)}.viewer-media img.is-new{opacity:0;transform:scale(1.06) translateX(18px);filter:blur(2px)}.viewer-media img.is-new.is-visible{opacity:1;transform:scale(1.015) translateX(0);filter:blur(0)}.viewer-info{position:absolute;z-index:5;left:50%;top:50%;transform:translate(-50%,-42%);width:min(900px,82vw);text-align:center;text-shadow:0 2px 30px rgba(0,0,0,.62)}.viewer-profession{margin:0 0 12px;font:500 9px var(--mono);letter-spacing:.2em;text-transform:uppercase;opacity:.86}.viewer-name{margin:0 0 10px;font:500 clamp(1rem,1.35vw,1.2rem)/1.2 var(--body);letter-spacing:.02em;opacity:.92}.viewer-quote{margin:0 auto 14px;max-width:820px;font:italic clamp(1.7rem,3.2vw,3.55rem)/1.15 var(--display);letter-spacing:-.025em;color:#fff}.viewer-location{font:9px var(--mono);letter-spacing:.12em;opacity:.72;text-transform:uppercase}.viewer-actions{position:fixed;inset:0;pointer-events:none;margin:0}.viewer-arrow{position:absolute;top:50%;transform:translateY(-50%);font-size:1.7rem;line-height:1;opacity:.62;pointer-events:auto;padding:18px}.viewer-arrow:first-child{left:18px}.viewer-arrow:last-of-type{right:18px}.alt-view{position:fixed;top:34px;right:34px;z-index:80;display:none;align-items:center;gap:9px;padding:11px 15px;border:1px solid rgba(248,243,233,.3);border-radius:999px;background:rgba(16,22,21,.68);backdrop-filter:blur(14px);font:500 10px var(--mono);letter-spacing:.12em;text-transform:uppercase;opacity:.92}.alt-view.is-visible{display:inline-flex}.music-player{position:fixed;z-index:50;left:50%;bottom:88px;transform:translateX(-50%);width:min(410px,calc(100vw - 40px));height:58px;border:1px solid rgba(248,243,233,.14);border-radius:999px;background:rgba(13,18,17,.82);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 12px 40px rgba(0,0,0,.38);display:none;align-items:center;padding:7px 10px 7px 8px}.music-player.is-visible{display:flex}.music-art{width:42px;height:42px;flex:0 0 42px;border-radius:50%;object-fit:cover;background:#303836}.music-copy{min-width:0;flex:1;padding:0 11px}.music-kicker{font:7px var(--mono);letter-spacing:.14em;text-transform:uppercase;opacity:.52;margin-bottom:3px}.music-title{font:500 11px var(--body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.music-controls{display:flex;align-items:center;gap:2px}.music-controls button{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:14px;opacity:.76}.music-controls button:hover{background:rgba(255,255,255,.08);opacity:1}.music-play{font-size:12px!important;background:rgba(248,243,233,.12)}.music-open{font:8px var(--mono)!important;letter-spacing:.08em;text-transform:uppercase;width:auto!important;padding:0 9px}.yt-audio-engine{position:fixed;width:1px;height:1px;left:-10000px;top:-10000px;opacity:0;pointer-events:none}.story-thumbs{position:fixed;z-index:35;left:clamp(20px,6vw,96px);right:clamp(20px,6vw,96px);bottom:18px;display:flex;gap:9px;overflow-x:auto;padding:8px 4px 10px;scrollbar-width:none}.story-thumbs::-webkit-scrollbar{display:none}.story-thumb{position:relative;flex:0 0 78px;height:52px;overflow:hidden;border:1px solid rgba(248,243,233,.27);background:#293330;opacity:.48}.story-thumb img{width:100%;height:100%;display:block;object-fit:cover}.story-thumb span{position:absolute;left:5px;bottom:4px;font:8px var(--mono);text-shadow:0 1px 5px #000}.story-thumb.is-active{opacity:1;border-color:var(--accent);transform:translateY(-5px)}@media(max-width:800px){.archive-intro{top:17px}.home-link{left:18px}.viewer-info{top:47%;width:calc(100vw - 38px)}.viewer-quote{font-size:clamp(1.5rem,7vw,2.25rem);line-height:1.16}.viewer-name{font-size:.95rem}.viewer-arrow{padding:14px}.viewer-arrow:first-child{left:6px}.viewer-arrow:last-of-type{right:6px}.alt-view{top:54px;right:18px;padding:10px 13px;font-size:9px}.music-player{bottom:72px;width:calc(100vw - 28px)}.music-open{display:none!important}.story-thumbs{left:14px;right:14px;bottom:8px}.story-thumb{flex-basis:62px;height:42px}}
</style></head><body>
<section class="hero" id="top"><div class="hero-media" aria-hidden="true"></div><div class="hero-copy"><p class="hero-kicker">A photographic archive of where India works</p><h1>The Great Indian <em>Table</em></h1><button class="hero-cta" type="button" data-explore>Enter the tables <span>→</span></button></div></section>
<section class="archive" id="stories" aria-label="Full-screen table stories"><div class="archive-intro"><button class="home-link" type="button" data-home>← Home</button><h2>The stories are in the details.</h2></div><div class="story-viewer"><div class="viewer-media" id="viewer-media"></div><div class="viewer-info"><p class="viewer-profession" id="viewer-profession"></p><h2 class="viewer-name" id="viewer-name"></h2><p class="viewer-quote" id="viewer-quote"></p><p class="viewer-location" id="viewer-location"></p><div class="viewer-actions"><button class="viewer-arrow" type="button" data-slide="-1">←</button><button class="viewer-arrow" type="button" data-slide="1">→</button></div></div><button class="alt-view" id="alt-view" type="button" hidden>↻ <span id="alt-label">VIEW NEXT PHOTO</span> <span id="alt-count"></span></button><div class="music-player" id="music-player"><img class="music-art" id="music-art" src="assets/img/Hero.JPEG" alt=""><div class="music-copy"><div class="music-kicker">YouTube Music</div><div class="music-title" id="music-title"></div></div><div class="music-controls"><button id="music-prev" type="button" aria-label="Previous song">←</button><button class="music-play" id="music-play" type="button" aria-label="Play or pause music">▶</button><button id="music-next" type="button" aria-label="Next song">→</button><button class="music-open" id="music-open" type="button">OPEN</button></div></div></div><div class="story-thumbs" id="story-thumbs"></div><div class="yt-audio-engine" id="yt-audio-engine" aria-hidden="true"></div></section>
<script src="assets/stories.js?v=20260911-2"></script><script src="assets/music.js?v=20260911-5"></script><script src="https://www.youtube.com/iframe_api"></script><script>
(()=>{const stories=Array.isArray(window.STORIES)?window.STORIES:[],music=window.PROFESSION_MUSIC||{};const $=id=>document.getElementById(id),media=$('viewer-media'),thumbs=$('story-thumbs'),altBtn=$('alt-view'),altLabel=$('alt-label'),altCount=$('alt-count'),player=$('music-player'),art=$('music-art'),title=$('music-title'),play=$('music-play');let activeIndex=0,imageIndex=0,musicIndex=0,transitionTimer=0,ytPlayer=null,ytReady=false,ytPending=null,currentVideoId=null,musicIsPlaying=false;
const esc=v=>String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function renderThumbs(){thumbs.innerHTML=stories.map((s,i)=>`<button class="story-thumb${i===activeIndex?' is-active':''}" type="button" data-thumb="${i}" aria-label="View ${esc(s.name)}">${s.images?.[0]?`<img loading="eager" decoding="async" fetchpriority="low" src="${esc(s.images[0])}" alt="">`:''}<span>${String(i+1).padStart(2,'0')}</span></button>`).join('');thumbs.querySelectorAll('[data-thumb]').forEach(b=>b.onclick=()=>showStory(+b.dataset.thumb))}
function videoId(item){const u=item?.url||'';const m=u.match(/(?:embed\/|watch\?v=)([\w-]{6,})/);return m?m[1]:null}
function ytMusicUrl(item){const id=videoId(item);return id?`https://music.youtube.com/watch?v=${id}`:'https://music.youtube.com/'}
function currentMusic(){const list=music[stories[activeIndex]?.profession]||[];return list[musicIndex]||list[0]||null}
function syncPlayButton(){play.textContent=musicIsPlaying?'❚❚':'▶';play.setAttribute('aria-label',musicIsPlaying?'Pause music':'Play music')}
function stopYT(){musicIsPlaying=false;currentVideoId=null;if(ytPlayer&&ytReady){try{ytPlayer.stopVideo()}catch(e){}}syncPlayButton()}
function cueCurrent(){const item=currentMusic(),id=videoId(item);if(!id||!ytPlayer||!ytReady)return;if(currentVideoId!==id){currentVideoId=id;ytPlayer.cueVideoById(id)}syncPlayButton()}
function playCurrent(){const item=currentMusic(),id=videoId(item);if(!id)return;if(!ytReady||!ytPlayer){ytPending='play';syncPlayButton();return}if(currentVideoId!==id){currentVideoId=id;ytPlayer.loadVideoById(id)}else ytPlayer.playVideo();musicIsPlaying=true;syncPlayButton()}
function pauseCurrent(){if(ytPlayer&&ytReady)ytPlayer.pauseVideo();musicIsPlaying=false;syncPlayButton()}
window.onYouTubeIframeAPIReady=()=>{ytPlayer=new YT.Player('yt-audio-engine',{width:'1',height:'1',videoId:'',playerVars:{autoplay:0,controls:0,disablekb:1,fs:0,iv_load_policy:3,playsinline:1,rel:0},events:{onReady:()=>{ytReady=true;cueCurrent();if(ytPending==='play'){ytPending=null;playCurrent()}},onStateChange:e=>{if(e.data===YT.PlayerState.PLAYING){musicIsPlaying=true;syncPlayButton()}else if(e.data===YT.PlayerState.PAUSED){musicIsPlaying=false;syncPlayButton()}else if(e.data===YT.PlayerState.ENDED){musicIsPlaying=true;stepMusic(1,true)}}}})};
function loadMusic(s){const list=music[s.profession]||[];musicIndex=0;if(!list.length){player.classList.remove('is-visible');stopYT();return}player.classList.add('is-visible');setMusic(list[0]);if(document.body.classList.contains('is-stories'))playCurrent();else cueCurrent()}
function setMusic(item){title.textContent=item?.title||'';art.src=stories[activeIndex]?.images?.[0]||'assets/img/Hero.JPEG';play.dataset.url=ytMusicUrl(item);syncPlayButton()}
function stepMusic(dir,autoPlay=true){const list=music[stories[activeIndex]?.profession]||[];if(!list.length)return;musicIndex=(musicIndex+dir+list.length)%list.length;const item=list[musicIndex];setMusic(item);if(autoPlay)playCurrent();else cueCurrent()}
function toggleMusic(){if(musicIsPlaying)pauseCurrent();else playCurrent()}
function openMusic(){const u=play.dataset.url||'https://music.youtube.com/';window.open(u,'_blank','noopener,noreferrer')}
function setMeta(s){$('viewer-profession').textContent=s.profession||'';$('viewer-name').textContent=s.name||'';$('viewer-quote').textContent=s.quote?`“${s.quote}”`:'';$('viewer-location').textContent=s.location||'';const n=s.images?.length||0;imageIndex=Math.min(imageIndex,n-1);altBtn.hidden=n<2;altBtn.classList.toggle('is-visible',n>=2);if(n>=2)altCount.textContent=`${String(imageIndex+1).padStart(2,'0')} / ${String(n).padStart(2,'0')}`;else altCount.textContent='';loadMusic(s)}
function renderImage(src,animate=true){if(!src)return;clearTimeout(transitionTimer);const old=media.querySelector('img'),next=document.createElement('img');next.src=src;next.alt=`${stories[activeIndex].name}'s table in ${stories[activeIndex].location}`;next.decoding='async';next.fetchPriority='high';next.className=animate?'is-new':'';media.appendChild(next);requestAnimationFrame(()=>requestAnimationFrame(()=>next.classList.add('is-visible')));if(old){old.classList.add('is-old');transitionTimer=setTimeout(()=>old.remove(),850)}else next.classList.add('is-visible')}
function showStory(index){if(!stories.length)return;activeIndex=(index+stories.length)%stories.length;imageIndex=0;const s=stories[activeIndex];setMeta(s);media.querySelectorAll('img').forEach(x=>x.remove());renderImage(s.images?.[0],false);renderThumbs();thumbs.querySelector(`[data-thumb="${activeIndex}"]`)?.scrollIntoView({block:'nearest',inline:'center',behavior:'smooth'})}
function altView(){const s=stories[activeIndex];if(!s.images||s.images.length<2)return;imageIndex=(imageIndex+1)%s.images.length;altCount.textContent=`${String(imageIndex+1).padStart(2,'0')} / ${String(s.images.length).padStart(2,'0')}`;renderImage(s.images[imageIndex],true)}
function enter(){document.body.classList.add('is-stories');showStory(0);playCurrent()}
$('music-prev').onclick=()=>stepMusic(-1,true);$('music-next').onclick=()=>stepMusic(1,true);$('music-play').onclick=toggleMusic;$('music-open').onclick=openMusic;$('alt-view').onclick=altView;document.querySelector('[data-explore]').onclick=enter;document.querySelectorAll('[data-slide]').forEach(b=>b.onclick=()=>showStory(activeIndex+Number(b.dataset.slide)));document.querySelector('[data-home]').onclick=()=>{stopYT();document.body.classList.remove('is-stories')};let lastStoryArrow=0;document.addEventListener('keydown',e=>{if(!document.body.classList.contains('is-stories'))return;if(e.metaKey||e.ctrlKey||e.altKey||e.repeat)return;if(e.key!=='ArrowRight'&&e.key!=='ArrowLeft')return;const now=Date.now();if(now-lastStoryArrow<260)return;lastStoryArrow=now;e.preventDefault();e.stopImmediatePropagation();showStory(activeIndex+(e.key==='ArrowRight'?1:-1))},true);let wheelTimer=0;document.addEventListener('wheel',e=>{if(!document.body.classList.contains('is-stories')||Date.now()<wheelTimer||Math.abs(e.deltaY)<18)return;wheelTimer=Date.now()+700;showStory(activeIndex+(e.deltaY>0?1:-1))},{passive:true});let touchY=0;document.addEventListener('touchstart',e=>{if(document.body.classList.contains('is-stories'))touchY=e.changedTouches[0].clientY},{passive:true});document.addEventListener('touchend',e=>{if(!document.body.classList.contains('is-stories'))return;const dy=touchY-e.changedTouches[0].clientY;if(Math.abs(dy)>45)showStory(activeIndex+(dy>0?1:-1))},{passive:true});renderThumbs();if(stories.length)showStory(0)})();
</script></body></html>
