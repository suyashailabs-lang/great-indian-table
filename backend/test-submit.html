<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Apps Script submission test</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 480px; margin: 40px auto; padding: 0 20px; }
  label { display: block; margin-bottom: 14px; font-size: 14px; }
  input[type="text"] { width: 100%; padding: 6px; margin-top: 4px; }
  button { padding: 10px 18px; font-size: 15px; cursor: pointer; }
  p.note { color: #555; font-size: 13px; }
</style>
</head>
<body>
<h1>Apps Script submission test</h1>
<p class="note">
  No hidden iframe here — this opens the real Apps Script response in a
  new tab, so you can read <code>workspace_photo_saved</code> /
  <code>portrait_photo_saved</code> directly instead of digging through
  DevTools. Delete this file before launch — it's a dev tool, not part
  of the site.
</p>

<form id="test-form" method="POST" enctype="multipart/form-data" target="_blank"
      action="https://script.google.com/macros/s/AKfycbzH3lsZbOfXM__5Bvlfx-9mpOtighO1RFt-iMFaBO4QGd-ARskMFF32XCYcRliAeW6-/exec">
  <label>Name <input type="text" name="name" value="Test Person"></label>
  <label>Profession <input type="text" name="profession" value="Debug Tester"></label>
  <label>City / State <input type="text" name="city_state" value="Testville, Testland"></label>
  <label>Workspace photo <input type="file" id="workspace-input" accept="image/*"></label>
  <label>Portrait photo <input type="file" id="portrait-input" accept="image/*"></label>
  <button type="submit">Send test submission</button>
</form>

<script>
function readAndCompressImage(file, maxDim, quality) {
  return new Promise((resolve, reject) => {
    if (!file) { resolve(null); return; }
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("Could not read file"));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("Could not decode image"));
      img.onload = () => {
        let { width, height } = img;
        if (width > maxDim || height > maxDim) {
          const scale = maxDim / Math.max(width, height);
          width = Math.round(width * scale);
          height = Math.round(height * scale);
        }
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        canvas.getContext("2d").drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function setHiddenField(form, fieldName, value) {
  let input = form.querySelector(`input[type="hidden"][name="${fieldName}"]`);
  if (!input) {
    input = document.createElement("input");
    input.type = "hidden";
    input.name = fieldName;
    form.appendChild(input);
  }
  input.value = value || "";
}

document.getElementById("test-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const form = e.target;
  const workspaceFile = document.getElementById("workspace-input").files[0];
  const portraitFile = document.getElementById("portrait-input").files[0];

  console.log("Selected files:", { workspaceFile, portraitFile });

  let workspaceB64, portraitB64;
  try {
    [workspaceB64, portraitB64] = await Promise.all([
      readAndCompressImage(workspaceFile, 1600, 0.82),
      readAndCompressImage(portraitFile, 1200, 0.85)
    ]);
  } catch (err) {
    alert("Image processing failed: " + err.message);
    return;
  }

  console.log("Base64 lengths:", {
    workspace: workspaceB64 ? workspaceB64.length : 0,
    portrait: portraitB64 ? portraitB64.length : 0
  });

  setHiddenField(form, "workspace_photo_base64", workspaceB64);
  setHiddenField(form, "portrait_photo_base64", portraitB64);

  form.submit(); // real navigation, opens in the new tab per target="_blank"
});
</script>
</body>
</html>
